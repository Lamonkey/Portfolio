# Fly.io configuration for the Django + MCP portfolio.
#
# See docs/DEPLOY_FLY.md for the full deployment runbook, including the
# secrets that have to be set before the first `fly deploy`.

app = "lamonkey-portfolio"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

# Equivalent of Heroku's `release:` process type in the Procfile. Runs in a
# throwaway machine off the freshly built image before any traffic is shifted;
# a non-zero exit aborts the deploy.
[deploy]
  release_command = "python manage.py migrate --noinput"

[env]
  PORT = "8000"
  MODE = "production"

[http_service]
  internal_port = 8000
  force_https = true
  # Scale to zero when idle. A blog gets little traffic and Fly bills by the
  # second, so an idle machine costs nothing. The trade-off is a cold start
  # (a few seconds) on the first request after a quiet period — including the
  # first /mcp call. Set min_machines_running = 1 if that bothers you.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
