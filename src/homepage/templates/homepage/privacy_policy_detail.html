{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ policy.title }} · Jesse Chen</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=Source+Serif+4:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="{% static 'homepage/software-log.css' %}" />
    <link rel="icon" type="image/x-icon" href="{% static 'homepage/favicon.ico' %}" />
  </head>
  <body class="software-detail-body">
    <div class="page-shell detail-shell">
      <a class="back-link" href="{% url 'homepage:software-log' %}">← Back to apps</a>
      <article class="detail-card app-detail">
        <p class="card-meta">Legal</p>
        <h1>{{ policy.title }}</h1>
        <div class="detail-body">
          {{ policy.content_html|safe }}
        </div>
        {% if related_projects %}
        <div class="detail-links">
          {% for project in related_projects %}
          <a class="btn ghost" href="{% url 'homepage:software-log-detail' slug=project.slug %}">
            {{ project.title }}
          </a>
          {% endfor %}
        </div>
        {% endif %}
      </article>
    </div>
  </body>
</html>
