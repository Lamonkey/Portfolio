services:
  db:
    image: postgres:15-alpine
    container_name: portfolio_db
    environment:
      POSTGRES_DB: portfolio_db
      POSTGRES_USER: portfolio_user
      POSTGRES_PASSWORD: portfolio_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio_user -d portfolio_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: portfolio_web
    # The bind mount below shadows /app, including the staticfiles the image
    # collected at build time — so collect them again at startup here.
    # Must be asgi: /mcp and the OAuth routes only exist in Portfolio/asgi.py.
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             python -m uvicorn Portfolio.asgi:application --host 0.0.0.0 --port 8000"
    volumes:
      - ./src:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://portfolio_user:portfolio_password@db:5432/portfolio_db
      - MODE=development
      - DEBUG=True
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY must be set in .env}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1,0.0.0.0}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:

